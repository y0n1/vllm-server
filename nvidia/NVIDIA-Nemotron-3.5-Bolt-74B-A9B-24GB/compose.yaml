services:    
  vllm:
    image: eugr/spark-vllm:nightly-20261016
    container_name: vllm-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
    restart: unless-stopped
    ipc: host
    network_mode: host
    shm_size: '16gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - ${PWD}/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB/config.yaml:/workspace/vllm/config.yaml:ro
    volumes:
      - vllm-huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
      - vllm-flashinfer:/root/.cache/flashinfer
      - vllm-triton:/root/.triton
    command: vllm serve --config config.yaml
volumes:
  vllm-huggingface:
  vllm-cache:
  vllm-flashinfer:
  vllm-triton: