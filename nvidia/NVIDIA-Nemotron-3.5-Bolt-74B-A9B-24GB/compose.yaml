services:
  vllm:
    image: eugr/spark-vllm:nightly-20261016
    container_name: vllm-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
    restart: unless-stopped
    ipc: host
    network_mode: host
    shm_size: '16gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/vllm:/root/.cache/vllm
      - ${HOME}/.cache/flashinfer:/root/.cache/flashinfer
      - ${HOME}/.triton:/root/.triton
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      vllm serve nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
      --kv-cache-dtype fp8
      --max-num-seqs 8
      --trust-remote-code
      --max-model-len auto
      --gpu-memory-utilization 0.8
      --max-num-batched-tokens 4096
      --speculative_config.model nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr
      --speculative_config.method dflash
      --speculative_config.num_speculative_tokens 7
      --load-format instanttensor
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser nemotron_v3
      --enable-mamba-shared-prefix-checkpoint
      --block-size 64
      --prefix-match-unit 64
