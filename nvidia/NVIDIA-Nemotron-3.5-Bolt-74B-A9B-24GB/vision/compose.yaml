services:
  init-volumes:
    image: vllm/vllm-openai:latest
    user: "0:0"
    volumes:
      - vllm-cache:/cache/vllm
      - vllm-flashinfer:/cache/flashinfer
      - vllm-huggingface:/cache/huggingface
      - vllm-triton:/triton
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 2000:0 /cache && chown -R 2000:0 /triton"]
    restart: "no"
  
  vllm-vision:
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    image: vllm/vllm-openai:latest
    container_name: vllm-NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-vision
    # restart: unless-stopped
    user: "2000:0"
    ipc: host
    network_mode: host
    shm_size: '16gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_USE_V2_MODEL_RUNNER=1
    volumes:
      - vllm-cache:/home/vllm/.cache/vllm
      - vllm-flashinfer:/home/vllm/.cache/flashinfer
      - vllm-huggingface:/home/vllm/.cache/huggingface
      - vllm-triton:/home/vllm/.triton
      - ${PWD}/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB/vision/ultra_v3_reasoning_parser.py:/home/vllm/recipe/ultra_v3_reasoning_parser.py:ro
      - ${PWD}/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB/vision/config.vision.yaml:/home/vllm/recipe/config.vision.yaml:ro
      - ${PWD}/nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB/vision/entrypoint.sh:/home/vllm/entrypoint.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: ["/home/vllm/entrypoint.sh"]
volumes:
  vllm-huggingface:
  vllm-cache:
  vllm-flashinfer:
  vllm-triton: