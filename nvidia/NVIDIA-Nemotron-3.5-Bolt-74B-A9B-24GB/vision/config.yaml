model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB
trust-remote-code: true
load-format: auto
tensor-parallel-size: 1
max-model-len: 262144
max-num-seqs: 1
enable-chunked-prefill: true
kv-cache-dtype: fp8
linear-backend: b12x
moe-backend: b12x
attention-backend: FLASHINFER
mamba-backend: flashinfer
mamba-ssm-cache-dtype: bfloat16
mamba-cache-dtype: bfloat16
mamba-cache-mode: align
seed: 42
allowed-local-media-path: '/home/vllm/'
limit-mm-per-prompt:
  video: 1
  image: 1
video-pruning-rate: 0.5
media-io-kwargs:
  video:
    fps: 2
    num_frames: 256
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
reasoning-parser-plugin: /home/vllm/recipe/ultra_v3_reasoning_parser.py
reasoning-parser: ultra_v3
speculative-config:
  method: dflash
  model: nvidia/NVIDIA-Nemotron-3.5-Bolt-74B-A9B-24GB-LiLiCorr
  num_speculative_tokens: 7
  rejection_sample_method: standard
  attention_backend: FLASHINFER
  draft_load_config:
    load_format: auto
gpu-memory-utilization: 0.70
