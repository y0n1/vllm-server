services:    
  vllm:
    image: eugr/spark-vllm-b12x:nightly-20261015
    container_name: vllm-nvidia-Qwen3.8-Flash-Next-FP4-Local
    restart: unless-stopped
    ipc: host
    network_mode: host
    shm_size: '16gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_PLE_TABLE_MEMORY=disk
      - B12X_DISK_BACKEND=io_uring
      - CUTE_DSL_ARCH=sm_121a
      - SAFETENSORS_FAST_GPU=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_SSM_CONV_STATE_LAYOUT=DS
      - VLLM_USE_AOT_COMPILE=1
      - VLLM_USE_MEGA_AOT_ARTIFACT=1
      - VLLM_USE_V2_MODEL_RUNNER=1
      - B12X_POLICY_MODE=auto
      - VLLM_MXFP8_LM_HEAD=1
      - VLLM_B12X_MOE_FP4_LAYER_MAX_INPUT_SCALE=w13
      - VLLM_B12X_MOE_FP4_FORCE_A16=1
      - B12X_W4A16_A4_PREFILL=1
    volumes:
      - vllm-b12x:/root/.cache/b12x
      - vllm-cache:/root/.cache/vllm
      - vllm-flashinfer:/root/.cache/flashinfer
      - vllm-huggingface:/root/.cache/huggingface
      - vllm-triton:/root/.triton
      - ${PWD}/nvidia/Qwen3.8-Flash-Next-FP4-Local/config.yaml:/workspace/vllm/config.yaml:ro
    command: vllm serve --config config.yaml
volumes:
  vllm-b12x:
  vllm-cache:
  vllm-flashinfer:
  vllm-huggingface:
  vllm-triton: