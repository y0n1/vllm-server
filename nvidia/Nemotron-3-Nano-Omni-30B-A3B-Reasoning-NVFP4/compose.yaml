services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
    restart: unless-stopped
    ipc: host
    network_mode: host
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/vllm:/root/.cache/vllm
      - ${HOME}/.cache/flashinfer:/root/.cache/flashinfer
      - ${HOME}/.triton:/root/.triton
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-NVFP4
      --trust-remote-code
      --media-io-kwargs '{"video": {"num_frames": 512, "fps": 1}}'
      --video-pruning-rate 0.5
      --tensor-parallel-size 1
      --max-model-len auto
      --gpu-memory-utilization 0.95
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser nemotron_v3
