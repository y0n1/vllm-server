services:
  vllm:
    image: eugr/spark-vllm:latest
    container_name: vllm-NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    restart: unless-stopped
    ipc: host
    network_mode: host
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - vllm-huggingface:/home/vllm/.cache/huggingface
      - vllm-cache:/home/vllm/.cache/vllm
      - vllm-flashinfer:/home/vllm/.cache/flashinfer
      - vllm-triton:/home/vllm/.triton
      - ${PWD}/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4/config.yaml:/workspace/vllm/config.yaml:ro
    command: vllm serve--config config.yaml
volumes:
  vllm-huggingface:
  vllm-cache:
  vllm-flashinfer:
  vllm-triton:
