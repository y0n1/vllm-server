model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
kv-cache-dtype: fp8
max-num-seqs: 8
trust-remote-code: true
max-model-len: auto
gpu-memory-utilization: 0.8
max-num-batched-tokens: 8192
speculative_config.model: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr
speculative_config.method: dflash
speculative_config.num_speculative_tokens: 7
mamba-backend: flashinfer
mamba-ssm-cache-dtype: float16
enable-mamba-cache-stochastic-rounding: true
mamba-cache-philox-rounds: 5
enable-mamba-shared-prefix-checkpoint: true
prefix-match-unit: 64
block-size: 64
enable-auto-tool-choice: true
tool-call-parser: qwen3_coder
reasoning-parser: nemotron_v3
mm-processor-cache-gb: 0
limit-mm-per-prompt:
  video: 1
  image: 1
video-pruning-rate: 0.5
media-io-kwargs:
  video:
    fps: 2,
    num_frames: 256
load-format: instanttens
