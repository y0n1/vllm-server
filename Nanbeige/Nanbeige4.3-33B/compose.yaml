services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-Nanbeige4.3-33B
    restart: unless-stopped
    ipc: host
    network_mode: host
    shm_size: '16gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - ${PWD}/Nanbeige/Nanbeige4.3-33B/config.yaml:/workspace/vllm/config.yaml:ro
    volumes:
      - vllm-huggingface:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
      - vllm-flashinfer:/root/.cache/flashinfer
      - vllm-triton:/root/.triton
    command: vllm serve--config config.yaml
volumes:
  vllm-huggingface:
  vllm-cache:
  vllm-flashinfer:
  vllm-triton: